baseURL: "https://example.com/"
languageCode: "en-US"
title: "Example site for Swipefolio"

# The theme is this repo itself: themesDir points at the parent of the repo,
# so the repo folder must be named "hugo-swipefolio" (case-sensitive on Linux).
theme: "hugo-swipefolio"
themesDir: "../../"

# Sidebar menu. Entries that point at a section (pageRef: /posts/) list that
# section's pages underneath; every other entry is a plain link.
menus:
  main:
    - name: "About"
      weight: 1
      pageRef: "/"
    - name: "Projects"
      weight: 2
      pageRef: "/posts/"

params:
  description: "Minimal gallery built with Swipefolio"
  author:
    name: John Doe
    email: john.doe@gmail.com
  profile:
    avatarUrl: "https://placehold.co/400x400?text=Avatar"
    about: "About me"
