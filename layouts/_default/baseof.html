<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="{{ if .IsHome }}home{{ else }}gallery-page{{ end }}" data-site-title="{{ site.Title }}">
  <button class="hamburger" id="menuToggle" type="button" aria-label="Toggle menu" aria-controls="sidebar"
    aria-expanded="false">☰</button>
  <div class="overlay" id="overlay"></div>

  <div class="layout">
    <header class="sidebar" id="sidebar">
      {{ partial "header.html" . }}
    </header>

    <main>
      <div class="content">
        {{ block "main" . }}{{ end }}
      </div>
      <footer>
        {{ partial "footer.html" . }}
      </footer>
    </main>
  </div>

  {{ if not .IsHome }}
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  {{ end }}
  {{ partial "head/js.html" . }}
</body>

</html>
